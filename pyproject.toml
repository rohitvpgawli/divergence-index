[project]
name = "divergence-index"
version = "0.1.0"
description = "Headline vs. Kitchen Table Divergence Index — OECD/BIS data pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "airbyte>=0.30",
    "boto3>=1.44.9",
    "dagster>=1.13.31",
    "dagster-dbt>=0.29.31",
    "dagster-webserver>=1.13.31",
    "dbt-duckdb>=1.11.1",
    "duckdb>=1.1",
    "jsonschema>=4.26.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
