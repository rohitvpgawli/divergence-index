name: pipeline_refresh

on:
  schedule:
    - cron: "0 6 15 * *"   # monthly, 15th, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run pytest -q
      - name: Bronze ingestion (Airbyte connectors via PyAirbyte)
        run: uv run python pipeline/ingest/run_ingest.py
      - name: dbt build (staging models + tests)
        # GitHub has no AWS credentials, so read the bronze PyAirbyte just pulled.
        # On EC2 (Airbyte -> S3) drop the --vars to read S3 instead.
        run: uv run dbt build --project-dir pipeline/transform --profiles-dir pipeline/transform --vars '{bronze_source: local}'
      - name: Publish Gold (refuses if dbt failed; checks Q8 + Q9)
        run: uv run python pipeline/publish/export_gold.py
      - name: Commit new bronze vintage + Gold
        run: |
          git config user.name "divergence-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bronze data/gold
          git diff --cached --quiet || git commit -m "data: bronze vintage + gold $(date -u +%F)"
          git push
