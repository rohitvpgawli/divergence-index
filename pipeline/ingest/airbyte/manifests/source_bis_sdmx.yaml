# Airbyte low-code (declarative) source for the BIS Statistics SDMX API.
#
# K2 — Household Debt Service Ratio (WS_DSR, borrowers = households & NPISH).
# BIS uses ISO-2 country codes. Full refresh each run (see OECD manifest).

version: 7.49.0
type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - k2_household_dsr

definitions:
  bis_stream:
    type: DeclarativeStream
    primary_key: [ref_area, time_period]  # BIS returns one DSR series per country
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $ref: "#/schemas/sdmx_observation"
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: https://stats.bis.org/api/v1/data/
        path: >-
          {{ parameters['dataflow'] }}/{{ parameters['key_template'] | replace('{countries}', config['countries'] | join('+')) }}
        http_method: GET
        request_parameters:
          startPeriod: "{{ config['start_period'] }}"
          format: csv
        request_headers:
          User-Agent: divergence-index-pipeline
          Accept-Encoding: identity  # CsvDecoder streams raw bytes; avoid gzip bodies
        error_handler:
          type: DefaultErrorHandler
          max_retries: 5
          backoff_strategies:
            - type: ExponentialBackoffStrategy
              factor: 10
          response_filters:
            - type: HttpResponseFilter
              http_codes: [429, 500, 502, 503, 504]
              action: RETRY
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
      decoder:
        type: CsvDecoder
      paginator:
        type: NoPagination
    transformations:
      # 1) keep the complete source row, untouched, in `raw`
      - type: AddFields
        fields:
          - path: [raw]
            value: "{{ record }}"
      # 2) drop the original top-level CSV columns. All SDMX column names are
      #    UPPERCASE and all fields we add are lowercase, so this removes only
      #    source columns (they survive inside `raw`). Without this, destinations
      #    that keep undeclared columns (e.g. S3) get FREQ next to freq, etc.
      - type: RemoveFields
        field_pointers:
          - ["[A-Z]*"]
      # 3) derive the clean, standard fields from `raw`
      - type: AddFields
        fields:
          - path: [source]
            value: BIS
          - path: [indicator_id]
            value: "{{ parameters['indicator_id'] }}"
          - path: [dataflow]
            value: "{{ parameters['dataflow'] }}"
          - path: [ref_area]
            value: "{{ record['raw'][parameters['area_column']] }}"
            value_type: string
          - path: [freq]
            value: "{{ record['raw']['FREQ'] }}"
            value_type: string
          - path: [time_period]
            value: "{{ record['raw']['TIME_PERIOD'] }}"
            value_type: string
          - path: [obs_value]
            value: "{{ record['raw']['OBS_VALUE'] }}"
            value_type: string
          - path: [obs_status]
            value: "{{ record['raw'].get('OBS_STATUS', '') }}"
            value_type: string
          - path: [unit_measure]
            value: "{{ record['raw'].get('UNIT_MEASURE', '') }}"
            value_type: string
          - path: [series_variant]
            value: "{{ '' }}"  # empty, but non-empty template so the Builder UI accepts it
            value_type: string

streams:
  - $ref: "#/definitions/bis_stream"
    name: k2_household_dsr
    $parameters:
      indicator_id: K2
      dataflow: WS_DSR
      area_column: BORROWERS_CTY
      # Quarterly | country | H = households & NPISHs
      key_template: "Q.{countries}.H"

  - $ref: "#/definitions/bis_stream"
    name: ref_headline_cpi_bis
    $parameters:
      indicator_id: CPI_BIS
      dataflow: WS_LONG_CPI
      area_column: REF_AREA
      # Monthly | country | 628 = index level. Headline CPI for all 7 from one
      # source: the H2 equity deflator (D7). OECD's Japanese CPI ends 2021-Q2.
      key_template: "M.{countries}.628"

schemas:
  sdmx_observation:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    additionalProperties: true
    properties:
      source: {type: string}
      indicator_id: {type: string}
      dataflow: {type: string}
      ref_area: {type: string}
      freq: {type: string}
      time_period: {type: string}
      obs_value: {type: ["null", string]}
      obs_status: {type: ["null", string]}
      unit_measure: {type: ["null", string]}
      series_variant: {type: ["null", string]}
      raw: {type: object, additionalProperties: true}

spec:
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required: [countries, start_period]
    additionalProperties: true
    properties:
      countries:
        type: array
        title: Countries (ISO-2, BIS convention)
        description: "ISO 3166-1 alpha-2 codes, e.g. US (BIS uses 2-letter codes)."
        items:
          type: string
          pattern: "^[A-Z]{2}$"
        default: [US, CA, GB, DE, AU, JP, KR]
        order: 0
      start_period:
        type: string
        title: Start period
        default: "2009"
        order: 1
