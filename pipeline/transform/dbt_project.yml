name: divergence_index
version: "0.1.0"
config-version: 2
profile: divergence_index

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # s3    = Airbyte output in S3 (default, what production uses)
  # local = PyAirbyte Parquet under data/bronze/ (offline / dev)
  bronze_source: s3
  s3_bronze_root: s3://divergence-index-data-lqpeej/airbyte

models:
  divergence_index:
    staging:
      +schema: staging        # -> warehouse schema "staging"
      +materialized: view
    # silver/ and gold/ will be added once docs/DATA_CONTRACT.md is in place.

seeds:
  divergence_index:
    +schema: reference
