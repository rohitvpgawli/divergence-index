version: 2

models:
  - name: gld_divergence_panel
    description: >-
      DATA_CONTRACT §3 panel: one row per country_iso x quarter, balanced from 2010-Q1
      to latest_published_quarter, columns in contract order (38 with
      include_idx100_composites = false). Exported to data/gold/divergence_panel.{parquet,csv}.
      The enforced contract makes the build fail if any column name, type or count drifts;
      turning include_idx100_composites on therefore requires adding those 3 columns here
      (a contract MAJOR/MINOR change per DATA_CONTRACT §8).
    config:
      contract:
        enforced: true
    columns:
      - name: country_iso
        data_type: varchar
        description: "ISO-3 code; one of the 7-country cohort."
      - name: quarter
        data_type: varchar
        description: "YYYY-Qn."
      - name: quarter_start_date
        data_type: date
        description: "First day of the quarter."
      - name: is_baseline_window
        data_type: boolean
        description: "True for 2010-Q1..2019-Q4 (z-score estimation window)."
      - name: is_complete
        data_type: boolean
        description: "True only if all 7 components are non-null."
      - name: is_composite_eligible
        data_type: boolean
        description: "is_complete AND quarter <= latest_complete_common_quarter. Headline charts filter on this."
      - name: n_components_available
        data_type: integer
        description: "Count (0-7) of non-null raw components."
      - name: h1_real_gdp_pc_raw
        data_type: double
        description: "H1 in native units and direction (silver output)."
      - name: h1_real_gdp_pc_z
        data_type: double
        description: "H1 Model 1 z-score vs own 2010-19 norm, polarity-adjusted (higher = better)."
      - name: h1_real_gdp_pc_idx100
        data_type: double
        description: "H1 Model 2, 2019-Q4 = 100, polarity-adjusted."
      - name: h2_real_equity_raw
        data_type: double
        description: "H2 in native units and direction (silver output)."
      - name: h2_real_equity_z
        data_type: double
        description: "H2 Model 1 z-score vs own 2010-19 norm, polarity-adjusted (higher = better)."
      - name: h2_real_equity_idx100
        data_type: double
        description: "H2 Model 2, 2019-Q4 = 100, polarity-adjusted."
      - name: h3_unemployment_raw
        data_type: double
        description: "H3 in native units and direction (silver output)."
      - name: h3_unemployment_z
        data_type: double
        description: "H3 Model 1 z-score vs own 2010-19 norm, polarity-adjusted (higher = better)."
      - name: h3_unemployment_idx100
        data_type: double
        description: "H3 Model 2, 2019-Q4 = 100, polarity-adjusted."
      - name: k1_real_hhdi_pc_raw
        data_type: double
        description: "K1 in native units and direction (silver output)."
      - name: k1_real_hhdi_pc_z
        data_type: double
        description: "K1 Model 1 z-score vs own 2010-19 norm, polarity-adjusted (higher = better)."
      - name: k1_real_hhdi_pc_idx100
        data_type: double
        description: "K1 Model 2, 2019-Q4 = 100, polarity-adjusted."
      - name: k2_hh_dsr_raw
        data_type: double
        description: "K2 in native units and direction (silver output)."
      - name: k2_hh_dsr_z
        data_type: double
        description: "K2 Model 1 z-score vs own 2010-19 norm, polarity-adjusted (higher = better)."
      - name: k2_hh_dsr_idx100
        data_type: double
        description: "K2 Model 2, 2019-Q4 = 100, polarity-adjusted."
      - name: k3_house_price_income_raw
        data_type: double
        description: "K3 in native units and direction (silver output)."
      - name: k3_house_price_income_z
        data_type: double
        description: "K3 Model 1 z-score vs own 2010-19 norm, polarity-adjusted (higher = better)."
      - name: k3_house_price_income_idx100
        data_type: double
        description: "K3 Model 2, 2019-Q4 = 100, polarity-adjusted."
      - name: k4_essentials_cpi_raw
        data_type: double
        description: "K4 in native units and direction (silver output)."
      - name: k4_essentials_cpi_z
        data_type: double
        description: "K4 Model 1 z-score vs own 2010-19 norm, polarity-adjusted (higher = better)."
      - name: k4_essentials_cpi_idx100
        data_type: double
        description: "K4 Model 2, 2019-Q4 = 100, polarity-adjusted."
      - name: headline_z
        data_type: double
        description: "mean(h1_z, h2_z, h3_z); null if any is null."
      - name: kitchen_table_z
        data_type: double
        description: "mean(k1_z, k2_z, k3_z, k4_z); null if any is null."
      - name: divergence_gap_z
        data_type: double
        description: "headline_z - kitchen_table_z."
      - name: contrib_h1_z
        data_type: double
        description: "+1/3 x H1 z. The seven contributions sum to divergence_gap_z."
      - name: contrib_h2_z
        data_type: double
        description: "+1/3 x H2 z. The seven contributions sum to divergence_gap_z."
      - name: contrib_h3_z
        data_type: double
        description: "+1/3 x H3 z. The seven contributions sum to divergence_gap_z."
      - name: contrib_k1_z
        data_type: double
        description: "-1/4 x K1 z. The seven contributions sum to divergence_gap_z."
      - name: contrib_k2_z
        data_type: double
        description: "-1/4 x K2 z. The seven contributions sum to divergence_gap_z."
      - name: contrib_k3_z
        data_type: double
        description: "-1/4 x K3 z. The seven contributions sum to divergence_gap_z."
      - name: contrib_k4_z
        data_type: double
        description: "-1/4 x K4 z. The seven contributions sum to divergence_gap_z."
