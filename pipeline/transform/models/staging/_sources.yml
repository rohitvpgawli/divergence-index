version: 2

sources:
  - name: bronze
    description: Raw Airbyte output loaded by pipeline/ingest/load_bronze.py. All vintages, values as strings.
    schema: bronze
    tables:
      - name: h1_real_gdp_per_capita
        description: "H1 — real GDP per capita (OECD QNA, USD PPP chain-linked volume, SA)."
      - name: h2_share_price_index
        description: "H2 — national share price index, monthly, nominal (OECD FINMARK)."
      - name: h3_unemployment_rate
        description: "H3 — harmonised unemployment rate, monthly, SA (OECD IALFS)."
      - name: k1_real_hh_disposable_income_pc
        description: "K1 — real household gross disposable income per capita, index, SA (OECD Household Dashboard). KOR not published."
      - name: k1_hh_disposable_income_nominal
        description: "Nominal household + NPISH gross disposable income, national currency (OECD QSA). SA for USA/CAN/GBR/DEU/AUS; JPN/KOR NSA only."
      - name: k2_household_dsr
        description: "K2 — household debt service ratio, % of income (BIS WS_DSR). NSA."
      - name: k3_house_price_to_income
        description: "K3 — house price-to-income ratio index, SA (OECD Analytical House Prices)."
      - name: k4_cpi_components
        description: "K4 inputs — CPI headline (_T), food (CP01), energy (CP045_0722); NSA (OECD PRICES)."
      - name: ref_population
        description: "Population and employment (OECD QNA). Per-capita divisor."
      - name: ref_hh_consumption
        description: "Household final consumption, current prices and volume (OECD QNA). Deflator input."
      - name: ref_gdp_volume
        description: "GDP, national currency, current prices and chain-linked volume, SA (OECD QNA). H1 numerator (D4)."
      - name: ref_cpi_weights
        description: "National CPI basket weights, per mille, annual: food, energy, total (OECD). K4 food/energy weighting (D2)."
      - name: ingest_runs
        description: One row per stream per ingestion run.
