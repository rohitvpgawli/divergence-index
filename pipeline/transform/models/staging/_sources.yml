version: 2

sources:
  - name: bronze
    description: >-
      Raw OECD/BIS observations as published (values are strings, full source row in
      `raw` as JSON text). Read from Airbyte's S3 output, or from local PyAirbyte
      Parquet when var bronze_source = local. Every sync/vintage is kept; staging picks the latest.
    tables:
      - name: h1_real_gdp_per_capita
        description: "H1 — real GDP per capita (OECD QNA, USD PPP chain-linked volume, SA)."
        config:
          external_location: "{% if var('bronze_source') == 's3' %}read_parquet('{{ var('s3_bronze_root') }}/oecd/h1_real_gdp_per_capita/*.parquet', filename = true, union_by_name = true){% else %}read_parquet('data/bronze/h1_real_gdp_per_capita/vintage=*/data.parquet', hive_partitioning = true, union_by_name = true){% endif %}"
      - name: h2_share_price_index
        description: "H2 — national share price index, monthly, nominal (OECD FINMARK)."
        config:
          external_location: "{% if var('bronze_source') == 's3' %}read_parquet('{{ var('s3_bronze_root') }}/oecd/h2_share_price_index/*.parquet', filename = true, union_by_name = true){% else %}read_parquet('data/bronze/h2_share_price_index/vintage=*/data.parquet', hive_partitioning = true, union_by_name = true){% endif %}"
      - name: h3_unemployment_rate
        description: "H3 — harmonised unemployment rate, monthly, SA (OECD IALFS)."
        config:
          external_location: "{% if var('bronze_source') == 's3' %}read_parquet('{{ var('s3_bronze_root') }}/oecd/h3_unemployment_rate/*.parquet', filename = true, union_by_name = true){% else %}read_parquet('data/bronze/h3_unemployment_rate/vintage=*/data.parquet', hive_partitioning = true, union_by_name = true){% endif %}"
      - name: k1_real_hh_disposable_income_pc
        description: "K1 — real household gross disposable income per capita, index, SA (OECD Household Dashboard). KOR not published."
        config:
          external_location: "{% if var('bronze_source') == 's3' %}read_parquet('{{ var('s3_bronze_root') }}/oecd/k1_real_hh_disposable_income_pc/*.parquet', filename = true, union_by_name = true){% else %}read_parquet('data/bronze/k1_real_hh_disposable_income_pc/vintage=*/data.parquet', hive_partitioning = true, union_by_name = true){% endif %}"
      - name: k1_hh_disposable_income_nominal
        description: "Nominal household + NPISH gross disposable income, national currency (OECD QSA). SA for USA/CAN/GBR/DEU/AUS; JPN/KOR NSA only."
        config:
          external_location: "{% if var('bronze_source') == 's3' %}read_parquet('{{ var('s3_bronze_root') }}/oecd/k1_hh_disposable_income_nominal/*.parquet', filename = true, union_by_name = true){% else %}read_parquet('data/bronze/k1_hh_disposable_income_nominal/vintage=*/data.parquet', hive_partitioning = true, union_by_name = true){% endif %}"
      - name: k2_household_dsr
        description: "K2 — household debt service ratio, % of income (BIS WS_DSR). NSA."
        config:
          external_location: "{% if var('bronze_source') == 's3' %}read_parquet('{{ var('s3_bronze_root') }}/bis/k2_household_dsr/*.parquet', filename = true, union_by_name = true){% else %}read_parquet('data/bronze/k2_household_dsr/vintage=*/data.parquet', hive_partitioning = true, union_by_name = true){% endif %}"
      - name: k3_house_price_to_income
        description: "K3 — house price-to-income ratio index, SA (OECD Analytical House Prices)."
        config:
          external_location: "{% if var('bronze_source') == 's3' %}read_parquet('{{ var('s3_bronze_root') }}/oecd/k3_house_price_to_income/*.parquet', filename = true, union_by_name = true){% else %}read_parquet('data/bronze/k3_house_price_to_income/vintage=*/data.parquet', hive_partitioning = true, union_by_name = true){% endif %}"
      - name: k4_cpi_components
        description: "K4 inputs — CPI headline (_T), food (CP01), energy (CP045_0722); NSA (OECD PRICES)."
        config:
          external_location: "{% if var('bronze_source') == 's3' %}read_parquet('{{ var('s3_bronze_root') }}/oecd/k4_cpi_components/*.parquet', filename = true, union_by_name = true){% else %}read_parquet('data/bronze/k4_cpi_components/vintage=*/data.parquet', hive_partitioning = true, union_by_name = true){% endif %}"
      - name: ref_population
        description: "Population and employment (OECD QNA). Per-capita divisor."
        config:
          external_location: "{% if var('bronze_source') == 's3' %}read_parquet('{{ var('s3_bronze_root') }}/oecd/ref_population/*.parquet', filename = true, union_by_name = true){% else %}read_parquet('data/bronze/ref_population/vintage=*/data.parquet', hive_partitioning = true, union_by_name = true){% endif %}"
      - name: ref_hh_consumption
        description: "Household final consumption, current prices and volume (OECD QNA). Deflator input."
        config:
          external_location: "{% if var('bronze_source') == 's3' %}read_parquet('{{ var('s3_bronze_root') }}/oecd/ref_hh_consumption/*.parquet', filename = true, union_by_name = true){% else %}read_parquet('data/bronze/ref_hh_consumption/vintage=*/data.parquet', hive_partitioning = true, union_by_name = true){% endif %}"
      - name: ref_gdp_volume
        description: "GDP, national currency, current prices and chain-linked volume, SA (OECD QNA). H1 numerator (D4)."
        config:
          external_location: "{% if var('bronze_source') == 's3' %}read_parquet('{{ var('s3_bronze_root') }}/oecd/ref_gdp_volume/*.parquet', filename = true, union_by_name = true){% else %}read_parquet('data/bronze/ref_gdp_volume/vintage=*/data.parquet', hive_partitioning = true, union_by_name = true){% endif %}"
      - name: ref_cpi_weights
        description: "National CPI basket weights, per mille, annual: food, energy, total (OECD). K4 food/energy weighting (D2)."
        config:
          external_location: "{% if var('bronze_source') == 's3' %}read_parquet('{{ var('s3_bronze_root') }}/oecd/ref_cpi_weights/*.parquet', filename = true, union_by_name = true){% else %}read_parquet('data/bronze/ref_cpi_weights/vintage=*/data.parquet', hive_partitioning = true, union_by_name = true){% endif %}"
      - name: ref_headline_cpi_bis
        description: "Headline CPI, monthly index (BIS WS_LONG_CPI, 628 = index level). H2 deflator for all 7 (D7)."
        config:
          external_location: "{% if var('bronze_source') == 's3' %}read_parquet('{{ var('s3_bronze_root') }}/bis/ref_headline_cpi_bis/*.parquet', filename = true, union_by_name = true){% else %}read_parquet('data/bronze/ref_headline_cpi_bis/vintage=*/data.parquet', hive_partitioning = true, union_by_name = true){% endif %}"
