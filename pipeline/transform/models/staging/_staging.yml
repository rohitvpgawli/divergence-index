version: 2

models:
  - name: stg_h1_real_gdp_per_capita
    description: "Latest vintage, typed. H1 — real GDP per capita (OECD QNA, USD PPP chain-linked volume, SA)."
    data_tests:
      - unique_series_observation:
          columns: [country_iso3, freq, time_period, adjustment, sector, accounting_entry, transaction, price_base, expenditure, measure, unit_measure, transformation, ref_year_price, table_identifier]
    columns:
      - name: country_iso3
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('countries')
                field: iso3
      - name: period_start_date
        data_tests: [not_null]
      - name: time_period
        data_tests: [not_null]
